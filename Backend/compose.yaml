services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: visitorhub
      POSTGRES_USER: visitorhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Backend/.env}
    volumes:
      - visitorhub-postgres:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visitorhub -d visitorhub"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://visitorhub:${POSTGRES_PASSWORD}@db:5432/visitorhub
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Backend/.env}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build:
      context: ../Frontend/Dashboard
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:80"
    depends_on:
      - api

  kiosk:
    build:
      context: ../Kiosk-FrontEnd
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
        VITE_KIOSK_SITE_ID: ${VITE_KIOSK_SITE_ID:-}
    ports:
      - "3001:3000"
    depends_on:
      - api

volumes:
  visitorhub-postgres:
