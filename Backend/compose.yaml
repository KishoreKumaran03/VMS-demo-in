services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: visitorhub
      POSTGRES_USER: visitorhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Backend/.env}
    volumes:
      - visitorhub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visitorhub -d visitorhub"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: visitorhub
      DATABASE_USER: visitorhub
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Backend/.env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Backend/.env}
      INITIAL_SETUP_KEY: ${INITIAL_SETUP_KEY:-}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:5173}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

  dashboard:
    build:
      context: ../Frontend/Dashboard
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

  kiosk:
    build:
      context: ../Kiosk-FrontEnd
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
        VITE_KIOSK_SITE_ID: ${VITE_KIOSK_SITE_ID:-00000000-0000-4000-8000-000000000001}
    ports:
      - "3001:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  visitorhub-postgres:
